<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 1: User Registration with Node.js and MongoDB</title>
  <style>
    body { font-family: "Times New Roman", serif; color: blue; }
    h1 { text-align: center; }
    table { margin: auto; }
    td { padding: 8px 20px; }
    .star { color: red; }
    #details table { border-collapse: collapse; }
    #details td { border: 1px solid gray; width: 200px; padding: 10px; }
  </style>
</head>
<body>
  <p><b>Exercise 1: User Registration with Node.js and MongoDB</b> | <a href="Ex-10.html">Back</a></p>

  <!-- Home page (http://localhost:6000) -->
  <div id="home">
    <h1>User Registration Form</h1>
    <form id="regForm">
      <table>
        <tr><td>Name<span class="star">*</span></td>
            <td><input type="text" name="name" required></td></tr>
        <tr><td>Password<span class="star">*</span></td>
            <td><input type="password" name="password" required minlength="6"></td></tr>
        <tr><td>Age<span class="star">*</span></td>
            <td><input type="number" name="age" required min="1" max="120"></td></tr>
        <tr><td>Mobile Number<span class="star">*</span></td>
            <td><input type="tel" name="mobile" required pattern="[0-9]{10}" title="10 digits"></td></tr>
        <tr><td>Email<span class="star">*</span></td>
            <td><input type="email" name="email" required></td></tr>
        <tr><td>Gender<span class="star">*</span></td>
            <td><label><input type="radio" name="gender" value="Male" required> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label></td></tr>
        <tr><td>State<span class="star">*</span></td>
            <td><select name="state" required>
                  <option value="">-- Select --</option>
                  <option>Tamilnadu</option>
                  <option>Kerala</option>
                  <option>Karnataka</option>
                </select></td></tr>
        <tr><td>Skills<span class="star">*</span></td>
            <td><label><input type="checkbox" name="skills" value="Java Script"> Java Script</label>
                <label><input type="checkbox" name="skills" value="Python"> Python</label>
                <label><input type="checkbox" name="skills" value="C++"> C++</label>
                <label><input type="checkbox" name="skills" value="Java"> Java</label></td></tr>
        <tr><td></td><td><button type="submit">Submit</button></td></tr>
      </table>
    </form>
  </div>

  <!-- Result page (http://localhost:6000/server) -->
  <div id="details" style="display: none;">
    <h1><u>User Submitted Details</u></h1>
    <table id="result"></table>
    <p style="text-align: center;"><button id="again">Register another user</button></p>
  </div>

  <script>
    // In the browser an array stands in for the MongoDB "users" collection
    var users = [];

    function esc(text) {
      return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById("regForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var form = this;
      var skills = [];
      var boxes = form.querySelectorAll('input[name="skills"]:checked');
      for (var i = 0; i < boxes.length; i++) {
        skills.push(boxes[i].value);
      }
      if (skills.length == 0) {
        alert("Please select at least one skill");
        return;
      }

      // insertOne
      var user = {
        name: form.elements["name"].value,
        password: form.elements["password"].value,
        age: form.elements["age"].value,
        mobile: form.elements["mobile"].value,
        email: form.elements["email"].value,
        gender: form.elements["gender"].value,
        state: form.elements["state"].value,
        skills: skills.join(", ")
      };
      users.push(user);

      // findOne: read the saved record back and show it in a table
      var saved = users[users.length - 1];
      var rows = [
        ["Name", saved.name], ["Password", saved.password], ["Age", saved.age],
        ["Mobile Number", saved.mobile], ["Email", saved.email], ["Gender", saved.gender],
        ["State", saved.state], ["Skills", saved.skills]
      ];
      var html = "";
      for (var j = 0; j < rows.length; j++) {
        html += "<tr><td>" + rows[j][0] + "</td><td>" + esc(rows[j][1]) + "</td></tr>";
      }
      document.getElementById("result").innerHTML = html;
      document.getElementById("home").style.display = "none";
      document.getElementById("details").style.display = "block";
    });

    document.getElementById("again").addEventListener("click", function () {
      document.getElementById("regForm").reset();
      document.getElementById("details").style.display = "none";
      document.getElementById("home").style.display = "block";
    });
  </script>
</body>
</html>
