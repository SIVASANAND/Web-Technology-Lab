<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration Form</title>
  <style>
    body { font-family: "Times New Roman", serif; color: blue; }
    h1 { text-align: center; }
    table { margin: auto; }
    td { padding: 8px 20px; }
    .star { color: red; }
  </style>
</head>
<body>
  <h1>User Registration Form</h1>
  <!-- All fields use the built-in HTML form validator (required, pattern, min, max) -->
  <form action="/server" method="post" onsubmit="return checkSkills()">
    <table>
      <tr><td>Name<span class="star">*</span></td>
          <td><input type="text" name="name" required></td></tr>
      <tr><td>Password<span class="star">*</span></td>
          <td><input type="password" name="password" required minlength="6"></td></tr>
      <tr><td>Age<span class="star">*</span></td>
          <td><input type="number" name="age" required min="1" max="120"></td></tr>
      <tr><td>Mobile Number<span class="star">*</span></td>
          <td><input type="tel" name="mobile" required pattern="[0-9]{10}" title="10 digits"></td></tr>
      <tr><td>Email<span class="star">*</span></td>
          <td><input type="email" name="email" required></td></tr>
      <tr><td>Gender<span class="star">*</span></td>
          <td><label><input type="radio" name="gender" value="Male" required> Male</label>
              <label><input type="radio" name="gender" value="Female"> Female</label></td></tr>
      <tr><td>State<span class="star">*</span></td>
          <td><select name="state" required>
                <option value="">-- Select --</option>
                <option>Tamilnadu</option>
                <option>Kerala</option>
                <option>Karnataka</option>
              </select></td></tr>
      <tr><td>Skills<span class="star">*</span></td>
          <td><label><input type="checkbox" name="skills" value="Java Script"> Java Script</label>
              <label><input type="checkbox" name="skills" value="Python"> Python</label>
              <label><input type="checkbox" name="skills" value="C++"> C++</label>
              <label><input type="checkbox" name="skills" value="Java"> Java</label></td></tr>
      <tr><td></td><td><button type="submit">Submit</button></td></tr>
    </table>
  </form>

  <script>
    // HTML has no "required" for a checkbox group, so check at least one skill
    function checkSkills() {
      if (document.querySelectorAll('input[name="skills"]:checked').length == 0) {
        alert("Please select at least one skill");
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
