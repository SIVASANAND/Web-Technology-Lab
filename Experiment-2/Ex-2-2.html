<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex 2.2 - HTML5 Media Elements</title>
</head>
<body>
  <!-- Page 2 of the website: media elements -->
  <h1>Media Gallery</h1>
  <p><a href="Ex-2-1.html">Registration Form</a> | <a href="Ex-2-2.html">Media Gallery</a></p>

  <div>
    <h2>Image</h2>
    <img src="media/banner.svg" alt="Media banner" width="300" height="100">
  </div>

  <div>
    <h2>Audio</h2>
    <audio controls>
      <source src="media/tone.wav" type="audio/wav">
      Your browser does not support audio.
    </audio>
  </div>

  <div>
    <h2>Video</h2>
    <video width="320" controls>
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
      Your browser does not support video.
    </video>
  </div>

  <div>
    <h2>Embed</h2>
    <embed src="media/banner.svg" type="image/svg+xml" width="300" height="100">
  </div>

  <div>
    <h2>Iframe</h2>
    <iframe src="Ex-2-1.html" width="500" height="250" title="Registration form"></iframe>
  </div>

  <div>
    <h2>Media Summary</h2>
    <table border="1" cellpadding="5">
      <tr><th>Tag</th><th>Use</th></tr>
      <tr><td>audio</td><td>Plays sound</td></tr>
      <tr><td>video</td><td>Plays video</td></tr>
      <tr><td>embed</td><td>Shows external content</td></tr>
      <tr><td>iframe</td><td>Shows another web page</td></tr>
    </table>
  </div>

  <p>&copy; 2026 Sivasanand | URK24CS9062</p>
</body>
</html>
