<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6: Birthday Cake Order Form</title>
</head>
<body>
  <p><b>Exercise 6: Birthday Cake Order Form</b> | <a href="Ex-5.html">Back</a></p>
  <h1>Birthday Cake Order Form</h1>
  <fieldset>
    # of 1/2kg Cakes (Rs.100) <input type="text" id="small" value="0" /><br />
    # of 1kg Cakes (Rs.200) <input type="text" id="medium" value="0" /><br />
    # of 2kg Cakes (Rs.400) <input type="text" id="large" value="0" /><br />
    Tip:
    <label><input type="radio" value="10" name="tip" /> 10%</label>
    <label><input type="radio" value="15" name="tip" checked="checked" /> 15%</label>
    <label><input type="radio" value="20" name="tip" /> 20%</label> <br />
    <button id="submit">Calculate Order</button>
  </fieldset>
  <p>Cost of order: <span id="price"></span></p>

  <script>
    // unobtrusive event handler
    document.getElementById("submit").addEventListener("click", function () {
      var small = parseInt(document.getElementById("small").value);
      var medium = parseInt(document.getElementById("medium").value);
      var large = parseInt(document.getElementById("large").value);
      var tip = parseInt(document.querySelector('input[name="tip"]:checked').value);

      var cost = small * 100 + medium * 200 + large * 400;
      var afterTax = cost * 1.09;                 // 9% tax
      var total = afterTax + afterTax * tip / 100; // tip on cost after tax

      document.getElementById("price").innerHTML = "Rs." + total.toFixed(2);
    });
  </script>
</body>
</html>
