<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4: Currency Convertor</title>
</head>
<body>
  <p><b>Exercise 4: Currency Convertor</b> | <a href="Ex-5.html">Back</a></p>
  <h1>The Currency Convertor</h1>
  <fieldset>
    Convert <input type="text" id="data" />
    <select id="from">
      <option value="INR">Indian Rupee</option>
      <option value="USD">US Dollar</option>
    </select>
    to
    <select id="to">
      <option value="USD">US Dollar</option>
      <option value="INR">Indian Rupee</option>
    </select>
    <button onclick="convert();">Calculate</button>
    <span id="answer"></span>
  </fieldset>

  <script>
    function convert() {
      var amount = parseFloat(document.getElementById("data").value);
      var from = document.getElementById("from").value;
      var to = document.getElementById("to").value;
      var result;

      if (from == to) result = amount;
      else if (from == "INR") result = amount * 0.015;   // rupees to dollars
      else result = amount * 67.12;                      // dollars to rupees

      document.getElementById("answer").innerHTML = result.toFixed(2) + " " + to;
    }
  </script>
</body>
</html>
