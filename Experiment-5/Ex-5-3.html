<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex 5.3 - Fruit Farm</title>
</head>
<body>
  <h1>Fruit Farm</h1>
  <div>
    Rows: <input type="text" id="rows" />
    Columns: <input type="text" id="columns" /> <br />
    <button onclick="grow();">Plant Garden</button>
  </div>
  <div id="garden"></div>

  <script>
    function grow() {
      var rows = parseInt(document.getElementById("rows").value);
      var cols = parseInt(document.getElementById("columns").value);
      var fruits = ["images/apple.svg", "images/orange.svg"];
      var garden = document.getElementById("garden");
      garden.innerHTML = "";

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          // 0 or 1 with equal probability
          var n = Math.floor(Math.random() * 2);
          garden.innerHTML += "<img src='" + fruits[n] + "' width='100' height='100' alt='fruit'>";
        }
        garden.innerHTML += "<br>";
      }
    }
  </script>
</body>
</html>
