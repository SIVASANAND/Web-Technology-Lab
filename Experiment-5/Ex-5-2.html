<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2: BMI Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
  <a class="back" href="Ex-5.html">&larr; Back</a>
  <p class="label">Exercise 2</p>
  <h1>Calculate your Body Mass Index (BMI)!</h1>
  <fieldset>
    Weight (in kilograms): <input type="text" id="weight" /><br />
    Height (in meters): <input type="text" id="height" /><br />
    <button onclick="calculate();">Get BMI!</button>
  </fieldset>
  <p>
    Your BMI is <span id="score"></span>. <br />
    Your body type is <span id="type"></span>.
  </p>

  </main>

  <script>
    function calculate() {
      var weight = parseFloat(document.getElementById("weight").value);
      var height = parseFloat(document.getElementById("height").value);
      var bmi = weight / (height * height);

      var type;
      if (bmi < 18) type = "Underweight";
      else if (bmi <= 25) type = "Normal";
      else if (bmi <= 30) type = "Overweight";
      else type = "Obese";

      document.getElementById("score").innerHTML = bmi.toFixed(2);
      document.getElementById("type").innerHTML = type;
    }
  </script>
</body>
</html>
