<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 5: Coin Flip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
  <a class="back" href="Ex-5.html">&larr; Back</a>
  <p class="label">Exercise 5</p>
  <h1>Heads or Tails?</h1>
  <div>
    <img src="images/heads.png" id="coin" alt="coin" width="150" height="150" /> <br />
    <button id="flip">Flip!</button>
  </div>
  <p>
    Heads Total: <span id="num_heads">0</span><br />
    Tails Total: <span id="num_tails">0</span>
  </p>

  </main>

  <script>
    var heads = 0;
    var tails = 0;

    // attach the event handler to the button
    document.getElementById("flip").addEventListener("click", flipFunction);

    function flipFunction() {
      if (Math.random() < 0.5) {
        document.getElementById("coin").src = "images/heads.png";
        heads++;
      } else {
        document.getElementById("coin").src = "images/tails.png";
        tails++;
      }
      document.getElementById("num_heads").innerHTML = heads;
      document.getElementById("num_tails").innerHTML = tails;
    }
  </script>
</body>
</html>
