<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2: Cake Shop Order</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
  <main class="container" id="cakeshop">
  <a class="back" href="Ex-7.html">&larr; Back</a>
  <p class="label">Exercise 2</p>
  <h1>Cake Shop Order</h1>
  <div class="title">CAKE SHOP</div>
  <div class="cakes">
    <div><img src="images/colorcake.jpg" width="110" height="110" alt="Color cake"><br>Color Cake - Rs. 300</div>
    <div><img src="images/browncake.jpg" width="110" height="110" alt="Brown cake"><br>Brown Cake - Rs. 200</div>
    <div><img src="images/milkycake.jpg" width="110" height="110" alt="Milky cake"><br>Milky Cake - Rs. 250</div>
    <div><img src="images/blackforest.jpg" width="110" height="110" alt="Black forest cake"><br>Black Forest Cake - Rs. 350</div>
  </div>

  <h2>Order Cake</h2>
  <label>Color Cake(Quantity)</label><input type="number" id="color" value="0">
  <label>Brown Cake(Quantity)</label><input type="number" id="brown" value="0">
  <label>Milky Cake(Quantity)</label><input type="number" id="milky" value="0">
  <label>Black Forest Cake(Quantity)</label><input type="number" id="black" value="0">
  <button id="order">Place Order</button>

  <h3>Purchase Order Bill!!</h3>
  <p style="text-align: center;"><span class="total">Total Price</span><span id="price"></span></p>

  </main>

  <script>
    $(document).ready(function () {
      $("#order").click(function () {
        var total = $("#color").val() * 300 +
                    $("#brown").val() * 200 +
                    $("#milky").val() * 250 +
                    $("#black").val() * 350;
        $("#price").text("Rs." + total);
      });
    });
  </script>
</body>
</html>
