<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex 7.1 - Budget Calculator App</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    body { font-family: "Times New Roman", serif; text-align: center; }
    h1 { background: black; color: white; padding: 8px; }
    input { width: 70px; margin: 0 15px 10px 5px; }
    button { background: navy; color: white; padding: 8px 12px; border: none; }
    .out { display: inline-block; width: 90px; padding: 10px; margin: 15px 8px; color: white; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Budget Calculator App</h1>
  <p><b>Enter Amount that you want to Manage</b></p>
  <input type="number" id="amount" value="15000">
  <p><b>How would you like to divide your money?</b></p>
  Room Rent(%): <input type="number" id="rent" value="50">
  Accessories(%): <input type="number" id="acc" value="20">
  Emergency(%): <input type="number" id="emg" value="20">
  Saving(%): <input type="number" id="save" value="10">
  <br>
  <button id="evaluate">Evaluate My Money</button>
  <br>
  <div class="out" style="background: blue;">Room Rent<br><span id="o-rent"></span></div>
  <div class="out" style="background: green;">Accessories<br><span id="o-acc"></span></div>
  <div class="out" style="background: blue;">Emergency<br><span id="o-emg"></span></div>
  <div class="out" style="background: deeppink;">Saving<br><span id="o-save"></span></div>

  <script>
    $(document).ready(function () {
      $("#evaluate").click(function () {
        var amount = parseFloat($("#amount").val());
        var rent = parseFloat($("#rent").val());
        var acc = parseFloat($("#acc").val());
        var emg = parseFloat($("#emg").val());
        var save = parseFloat($("#save").val());

        // percentages must add up to 100 to divide the full amount
        if (rent + acc + emg + save != 100) {
          alert("Cannot divide the amount: the percentages must add up to 100%.");
          return;
        }

        $("#o-rent").text("Rs." + amount * rent / 100);
        $("#o-acc").text("Rs." + amount * acc / 100);
        $("#o-emg").text("Rs." + amount * emg / 100);
        $("#o-save").text("Rs." + amount * save / 100);
      });
    });
  </script>
</body>
</html>
