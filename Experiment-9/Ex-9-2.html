<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2: Cafe Website using AngularJS Routing</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular-route.js"></script>
  <script>
    var app = angular.module("cafeApp", ["ngRoute"]);

    app.config(function ($routeProvider) {
      $routeProvider
        .when("/", { templateUrl: "pages/home.htm" })
        .when("/menu", { templateUrl: "pages/menu.htm" })
        .when("/gallery", { templateUrl: "pages/gallery.htm" })
        .when("/contact", { templateUrl: "pages/contact.htm", controller: "contactCtrl" })
        .otherwise({ redirectTo: "/" });
    });

    app.controller("contactCtrl", function ($scope) {
      $scope.sent = false;
      $scope.send = function () {
        $scope.sent = true;
      };
    });
  </script>
</head>
<body ng-app="cafeApp">
  <main class="container" id="cafe">
  <a class="back" href="Ex-9.html">&larr; Back</a>
  <p class="label">Exercise 2</p>
  <h1>Green Leaf Cafe</h1>
  <nav>
    <a href="#!/">Home</a>
    <a href="#!/menu">Menu</a>
    <a href="#!/gallery">Gallery</a>
    <a href="#!/contact">Contact</a>
  </nav>

  <div class="page" ng-view></div>

  <footer>Green Leaf Cafe, Karunya Nagar, Coimbatore &middot; &copy; 2026 URK24CS9062</footer>
  </main>

</body>
</html>
