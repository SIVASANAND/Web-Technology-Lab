<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4: Move and Stop Car Image</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
  <a class="back" href="Ex-6.html">&larr; Back</a>
  <p class="label">Exercise 4</p>
  <h1>Moving Car</h1>
  <button onclick="moveRight()">Move</button>
  <button onclick="stop()">Stop</button>
  <div class="track">
    <img id="car" src="images/car.jpg" alt="car" width="180" height="119">
  </div>

  </main>

  <script>
    var imgObj;
    var animate;

    function init() {
      imgObj = document.getElementById("car");
      imgObj.style.position = "absolute";
      imgObj.style.left = "0px";
    }

    function moveRight() {
      clearTimeout(animate); // avoid speeding up on double click
      imgObj.style.left = parseInt(imgObj.style.left) + 1 + "px";
      animate = setTimeout(moveRight, 10); // call moveRight again in 10ms
    }

    function stop() {
      clearTimeout(animate);
      imgObj.style.left = "0px";
    }

    window.onload = init;
  </script>
</body>
</html>
