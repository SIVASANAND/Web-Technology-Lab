<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2: Background Colour Change every 30 Seconds</title>
</head>
<body>
  <p><b>Exercise 2: Background Colour Change every 30 Seconds</b> | <a href="Ex-6.html">Back</a></p>
  <h1>Dynamic Background!</h1>
  <p>Current colour: <span id="color"></span></p>

  <script>
    function setBackgroundColor() {
      var red = Math.floor(Math.random() * 255);
      var green = Math.floor(Math.random() * 255);
      var blue = Math.floor(Math.random() * 255);
      var color = "rgb(" + red + "," + green + "," + blue + ")";
      document.getElementsByTagName("body")[0].style.backgroundColor = color;
      document.getElementById("color").innerHTML = color;
    }

    setBackgroundColor();
    setInterval(setBackgroundColor, 30000); // every 30 seconds
  </script>
</body>
</html>
