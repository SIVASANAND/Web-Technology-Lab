<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2: Comment Box</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
</head>
<body ng-app="commentApp">
  <p><b>Exercise 2: Comment Box</b> | <a href="Ex-8.html">Back</a></p>
  <div ng-controller="FrmController">
    <h3>Post your Comment</h3>
    <textarea ng-model="txtcomment" placeholder="Your Comment" style="width: 550px;"></textarea><br>
    <button ng-click="btn_add()" style="margin-top: 10px;">Post Comment</button>

    <h4>Comments</h4>
    <ul>
      <li ng-repeat="comnt in comment track by $index">
        {{ comnt }} <a href="" ng-click="remItem($index)">x</a>
      </li>
    </ul>
  </div>

  <script>
    angular.module("commentApp", []).controller("FrmController", function ($scope) {
      $scope.comment = ["Clear explanation of ng-model and ng-click.", "The ng-repeat example was very helpful."];
      $scope.txtcomment = "";

      $scope.btn_add = function () {
        if ($scope.txtcomment != "") {
          $scope.comment.push($scope.txtcomment);
          $scope.txtcomment = "";
        }
      };

      $scope.remItem = function (index) {
        $scope.comment.splice(index, 1);
      };
    });
  </script>
</body>
</html>
