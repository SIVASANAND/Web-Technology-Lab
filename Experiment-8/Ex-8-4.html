<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4: Todo List</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
</head>
<body>
  <p><b>Exercise 4: Todo List</b> | <a href="Ex-8.html">Back</a></p>
  <h1>Todo List</h1>
  <div ng-app="todoApp" ng-controller="todoController">
    <input ng-model="title" placeholder="New task">
    <button ng-click="add()">Add</button>
    <ul>
      <li ng-repeat="t in tasks track by $index">{{ t }}</li>
    </ul>
  </div>

  <script>
    angular.module("todoApp", []).controller("todoController", function ($scope) {
      $scope.tasks = ["Complete the Web Technology lab record", "Revise AngularJS directives"];
      $scope.add = function () {
        if ($scope.title) {
          $scope.tasks.push($scope.title);
          $scope.title = "";
        }
      };
    });
  </script>
</body>
</html>
